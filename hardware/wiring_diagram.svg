<text x="1490" y="618" font-size="12" fill="#111" text-anchor="middle">IN+ ← S+ , IN− ← S− (twisted pair), REF1,REF2 → GND*</text>
<text x="1490" y="636" font-size="12" fill="#111" text-anchor="middle">V+ ← 3.3 V,  OUT → 100 Ω / 1 nF → PA0</text>
<text x="1490" y="654" font-size="12" fill="#555" text-anchor="middle">35 A → 35 mV → 1.75 V</text>
