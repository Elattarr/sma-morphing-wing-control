<text x="55" y="854" font-size="12" fill="#374151" text-anchor="start">→ U1 pin 6 LI  (Q1 on)</text>
<text x="55" y="870" font-size="13" fill="#111" text-anchor="start" font-weight="700">PA9  HRTIM1_CHA2 (AF13)</text>
<text x="55" y="884" font-size="12" fill="#374151" text-anchor="start">→ U1 pin 5 HI  (Q2 on, after dead time)</text>
<text x="55" y="900" font-size="13" fill="#111" text-anchor="start" font-weight="700">PA0  ADC1_IN1</text>
<text x="55" y="914" font-size="12" fill="#374151" text-anchor="start">← U2 OUT, sampled mid on-time</text>
<text x="55" y="930" font-size="13" fill="#111" text-anchor="start" font-weight="700">PA1  ADC1_IN2</text>
<text x="55" y="944" font-size="12" fill="#374151" text-anchor="start">← laser 4–20 mA over 150 Ω</text>
<text x="55" y="960" font-size="13" fill="#111" text-anchor="start" font-weight="700">PB13/14/15  SPI2</text>
<text x="55" y="974" font-size="12" fill="#374151" text-anchor="start">SCK / MISO / MOSI → U3, U4</text>
<text x="55" y="990" font-size="13" fill="#111" text-anchor="start" font-weight="700">PB12, PB1  GPIO</text>
<text x="55" y="1004" font-size="12" fill="#374151" text-anchor="start">CS for U3 (T1), U4 (T2)</text>
<text x="55" y="1020" font-size="13" fill="#111" text-anchor="start" font-weight="700">PB0  GPIO</text>
<text x="55" y="1034" font-size="12" fill="#374151" text-anchor="start">→ Q3 gate (relay coil driver)</text>
<text x="55" y="1050" font-size="13" fill="#111" text-anchor="start" font-weight="700">PA2/PA3  LPUART1</text>
<text x="55" y="1064" font-size="12" fill="#374151" text-anchor="start">ST-LINK VCP → laptop USB</text>
<rect x="1330" y="997" width="197.20000000000002" height="19" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="1335" y="1010" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">net PWM_LO: PA8 → U1 pin 6</text>
<rect x="1330" y="1023" width="197.20000000000002" height="19" rx="3" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="1335" y="1036" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">net PWM_HI: PA9 → U1 pin 5</text>
<rect x="1330" y="1049" width="182.8" height="19" rx="3" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="1335" y="1062" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">net ISENSE: U2 OUT → PA0</text>
<rect x="1330" y="1075" width="182.8" height="19" rx="3" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="1335" y="1088" font-size="12" fill="#1e3a8a" text-anchor="start" font-weight="700">net RELAY: PB0 → Q3 gate</text>
<rect x="500" y="780" width="380" height="150" rx="5" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
<text x="690" y="806" font-size="14" fill="#111" text-anchor="middle" font-weight="700">U3, U4  MAX31856 (TSSOP-14), 3.3 V</text>
<text x="515" y="830" font-size="12" fill="#111" text-anchor="start">SCK/SDI/SDO shared on SPI2; CS: U3 ← PB12, U4 ← PB1</text>
<text x="515" y="850" font-size="12" fill="#111" text-anchor="start">Type K, 0.25 mm, junction insulated from the wire</text>
<text x="515" y="870" font-size="12" fill="#111" text-anchor="start">(inputs protected to ±45 V, but wire sits ~2 V above GND:</text>
<text x="515" y="888" font-size="12" fill="#111" text-anchor="start"> a grounded or touching junction shorts the wire to the amp)</text>
<text x="515" y="912" font-size="12" fill="#555" text-anchor="start">U3 → T1 at 650 mm?  U4 → T2  (positions: see bench plan)</text>
<rect x="500" y="950" width="380" height="100" rx="5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="690" y="976" font-size="14" fill="#111" text-anchor="middle" font-weight="700">K1 coil drive</text>
<text x="515" y="998" font-size="12" fill="#111" text-anchor="start">Q3 2N7002* (gate ← PB0, 10 kΩ pull-down), coil +12 V</text>
<text x="515" y="1016" font-size="12" fill="#111" text-anchor="start">D2 1N4007* flyback across the coil</text>
<text x="515" y="1034" font-size="12" fill="#b91c1c" text-anchor="start">Relay closes only with PWM_LO low; opens before anything else</text>
<rect x="900" y="950" width="380" height="100" rx="5" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
<text x="1090" y="976" font-size="14" fill="#111" text-anchor="middle" font-weight="700">Laser displacement sensor, 4–20 mA out*</text>
<text x="915" y="998" font-size="12" fill="#111" text-anchor="start">loop 24 V* → sensor → 150 Ω to GND → PA1  (0.6–3.0 V)</text>
<text x="915" y="1016" font-size="12" fill="#111" text-anchor="start">RC 1 kΩ / 10 nF before PA1</text>
<text x="915" y="1034" font-size="12" fill="#b91c1c" text-anchor="start">range ≥10 mm; beam on wire end, not on the TE</text>
<text x="900" y="1110" font-size="12" fill="#374151" text-anchor="start">Single-point grounding: only the shunt low side, C1 and supply − meet at one copper pour; Kelvin sense traces S+/S− run as a pair to U2.</text>
<text x="900" y="1130" font-size="12" fill="#374151" text-anchor="start">Status of each part number is in the table: "checked" means I read it in a datasheet this session, otherwise it is a placeholder class.</text>
